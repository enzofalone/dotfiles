# Leader keys
set -g prefix C-Space
bind C-Space send-prefix # ensure we can still send to other apps

# Set secondary prefix (e.g., Ctrl-b)
set -g prefix2 C-b
bind C-b send-prefix # ensure we can still send to other apps

# Reload key
bind r source-file ~/.tmux.conf \; display 'Reloaded!'

# Split windows in a way I can remember
bind | split-window -h
bind - split-window -v

unbind '"'
unbind %

# Navigate windows using Ctrl+Tab and Ctrl+Shift+Tab (i give up)
# bind -n C-Tab select-window -n
# bind -n C-S-Tab select-window -p

# Select panes with Alt+arrows
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind k kill-window

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# don't rename windows automatically
set-option -g allow-rename off

# Setup status bar
set -g status-justify centre
set -g status-left-length 100
set -g status-left "#[fg=green]Session: #S "

# Start window numbering at 1
set -g base-index 1

# Start pane numbering at 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

set-option -g focus-events on

######## DESIGN TWEAKS
#
#

set -s theme terminal

# 24-bit color in terminals whose TERM is xterm-256color
set -as terminal-features ",xterm-256color:RGB"

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# Status bar position
set -g status-position top

# Status bar colors
set -g status-style 'bg=black fg=gray'
set -g status-left-length 20
set -g status-right-length 50

# Status bar content
set -g status-left '#[fg=seagreen,bold] #S #[fg=#30363d] '

# set -g status-right '#[fg=#30363d]│#[fg=#8b949e] %H:%M #[fg=#30363d]│#[fg=#8b949e] %d-%b-%y '
set -g status-right ''
# Window status
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[fg=seagreen,bold] #I:#W '

# Pane border colors
set -g pane-border-style 'fg=#30363d'
set -g pane-active-border-style 'fg=seagreen'

# Pane scrollbars — show scrollback position (tmux 3.6+)
# set -g pane-scrollbars on
# set -g pane-scrollbars-position right

# Message styling
set -g message-style 'bg=seagreen fg=black bold'

# ============================================
# PLUGINS (via TPM)
# ============================================

# Install TPM first:
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Plugin settings
set -g @resurrect-strategy-vim 'session'
set -g @continuum-restore 'on'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
